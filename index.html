<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIXINTESIX - HIDUP</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
body { height:100vh; display:flex; flex-direction:column; color:white; overflow:hidden; background:#050818; }
.pentas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; display:flex; align-items:center; justify-content:center; background: radial-gradient(circle at 50% 40%, #0a2a5a 0%, #050818 70%); overflow:hidden; }
.cahaya { position:absolute; width:350px; height:350px; border-radius:50%; background: radial-gradient(circle, rgba(34,211,238,0.5), transparent 70%); animation: denyut 2.5s ease-in-out infinite; }
@keyframes denyut { 0%,100%{transform:scale(1); opacity:0.6} 50%{transform:scale(1.2); opacity:1} }
.mavix-body { position:relative; width:340px; height:520px; animation: terapung 3s ease-in-out infinite; }
@keyframes terapung { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.mavix-foto { width:340px; height:520px; object-fit:cover; border-radius:20px; }
.header { display:flex; align-items:center; gap:12px; padding:12px 15px; background:rgba(5,8,24,0.7); }
.avatar { width:58px; height:58px; border-radius:50%; flex-shrink:0; border:3px solid #22d3ee; overflow:hidden; cursor:pointer; }
.avatar img { width:100%; height:100%; object-fit:cover; }
.judul h1 { font-size:22px; color:#22d3ee; }
.judul p { font-size:13px; color:#4ade80; }
.bar-mode { display:flex; gap:8px; padding:8px 10px; background:rgba(5,8,24,0.8); }
.bar-mode button { flex:1; padding:10px; border:none; border-radius:20px; font-weight:bold; cursor:pointer; background:#1a1a1a; color:white; }
.bar-mode button.aktif { background:#22d3ee; color:#000; }
#chatBox { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:82%; padding:12px 16px; border-radius:18px; font-size:16px; line-height:1.45; }
.mavix { align-self:flex-start; background:rgba(30,42,74,0.9); border:1px solid #2e4a7a; }
.user { align-self:flex-end; background:#22d3ee; color:#000; font-weight:500; }
.input-row { display:flex; gap:8px; padding:10px; background:rgba(5,8,24,0.8); align-items:center; }
#input { flex:1; padding:13px 16px; border-radius:25px; border:none; outline:none; background:#1a1a1a; color:white; font-size:15px; }
.btn { padding:12px 18px; border:none; border-radius:25px; font-weight:bold; font-size:15px; cursor:pointer; background:#22d3ee; color:#000; }
</style>
</head>
<body>
<div class="pentas">
  <div class="cahaya"></div>
  <div class="mavix-body">
    <img src="mavix.jpg?v=2" class="mavix-foto" alt="MAVIX">
  </div>
</div>
<div class="header">
  <div class="avatar" id="avatarBtn"><img src="mavix.jpg?v=2"></div>
  <div class="judul"><h1>MAVIXINTESIX</h1><p>● Online - Mode Ngobrol</p></div>
</div>
<div class="bar-mode">
  <button id="btnNgobrol" class="aktif" onclick="gantiMode('NGOBROL')">💬 Ngobrol</button>
  <button id="btnBaca" onclick="gantiMode('BACA')">📖 Baca</button>
</div>
<div id="chatBox"><div class="msg mavix">Halo Bos! Saya MAVIX, sudah pakai otak GPT 120B!</div></div>
<div class="input-row">
  <input id="input" placeholder="Tulis untuk MAVIX...">
  <button class="btn" id="kirimBtn">Kirim</button>
  <button class="btn" id="lambaiBtn">👋 Lambai</button>
</div>

<script src="otak-ingatan.js"></script>
<script src="otak-kecil.js"></script>
<script src="otak-tengah.js"></script>
<script src="mulut.js"></script>
<script src="otak-depan.js"></script>

<script>
function tambah(siapa, teks){
  const chat = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + siapa;
  if (teks.includes('<button') || teks.includes('<div id="isi_')) {
    div.innerHTML = teks.replace(/\n/g, '<br>');
  } else {
    div.innerText = teks;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function lambai(){
  tambah('mavix', 'Halo Bos! Saya melambai untuk Bos!');
  if(typeof bicara === 'function') bicara('Halo Bos! Saya melambai untuk Bos!');
}
function mavixNgomong(lagiNgomong){
  const foto = document.querySelector('.mavix-foto');
  if(!foto) return;
  foto.style.transform = lagiNgomong ? 'scale(1.03)' : 'scale(1)';
}
window.modeMavix = "NGOBROL";
function gantiMode(modeBaru){
  window.modeMavix = modeBaru;
  localStorage.setItem('modeMavix', modeBaru);
  document.getElementById('btnNgobrol').classList.toggle('aktif', modeBaru === 'NGOBROL');
  document.getElementById('btnBaca').classList.toggle('aktif', modeBaru === 'BACA');
  const judul = document.querySelector('.judul p');
  if(judul) judul.innerText = modeBaru === 'BACA' ? '● Online - Mode Baca' : '● Online - Mode Ngobrol';
  tambah('mavix', modeBaru === 'BACA' ? 'Siap Bos, Mode Baca. Saya jawab pendek saja.' : 'Siap Bos, Mode Ngobrol. Kita ngobrol santai ya.');
}
window.gantiMode = gantiMode;
window.tambah = tambah;
window.lambai = lambai;
window.mavixNgomong = mavixNgomong;
// Pulihkan mode terakhir
try {
  const modeLama = localStorage.getItem('modeMavix');
  if(modeLama) gantiMode(modeLama);
} catch(e){}
</script>
</body>
</html>
