<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIXINTESIX - HIDUP</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
body { height:100vh; display:flex; flex-direction:column; color:white; overflow:hidden; background: radial-gradient(circle at 50% 40%, #0a2a5a 0%, #050818 70%); }
.header { display:flex; align-items:center; gap:12px; padding:12px 15px; background:rgba(5,8,24,0.7); }
.judul h1 { font-size:22px; color:#22d3ee; }
#chatBox { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:82%; padding:12px 16px; border-radius:18px; font-size:16px; line-height:1.45; }
.mavix { align-self:flex-start; background:rgba(30,42,74,0.9); border:1px solid #2e4a7a; }
.user { align-self:flex-end; background:#22d3ee; color:#000; font-weight:500; }
.input-row { display:flex; gap:8px; padding:10px; background:rgba(5,8,24,0.8); align-items:center; }
#input { flex:1; padding:13px 16px; border-radius:25px; border:none; outline:none; background:#1a1a1a; color:white; font-size:15px; }
.btn { padding:12px 18px; border:none; border-radius:25px; font-weight:bold; font-size:15px; cursor:pointer; background:#22d3ee; color:#000; }
</style>
</head>
<body>
<div class="header">
  <div class="judul"><h1>MAVIXINTESIX</h1></div>
</div>
<div id="chatBox"></div>
<div class="input-row">
  <input id="input" placeholder="Tulis untuk MAVIX...">
  <button class="btn" id="kirimBtn">Kirim</button>
</div>

<!-- === 4 OTAK MAVIX === -->
<script src="otak-ingatan.js"></script>
<script src="otak-kecil.js"></script>
<script src="otak-tengah.js"></script>
<script src="otak-depan.js"></script>
  
<script>
function tambah(siapa, teks){
  const chat = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + siapa;
  if (teks.includes('<button') || teks.includes('<div id="isi_')) {
    div.innerHTML = teks.replace(/\n/g, '<br>');
  } else {
    div.innerText = teks;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

let modeMavix = "NGOBROL";
function gantiMode(modeBaru){
  modeMavix = modeBaru;
}
window.gantiMode = gantiMode;

async function kirim(){
  const inp = document.getElementById('input');
  const teks = inp.value.trim(); if(!teks) return;
  tambah('user', teks); inp.value='';

  // 1. OTAK KECIL DULU - Cepat, gratis, tanpa server
  try {
    let jawabKecil = null;
    if (typeof OtakKecil !== 'undefined' && OtakKecil.fikirKecil) {
      jawabKecil = OtakKecil.fikirKecil(teks);
    } else if (typeof pikirKecil === 'function') {
      jawabKecil = pikirKecil(teks);
    } else if (typeof fikirKecil === 'function') {
      jawabKecil = fikirKecil(teks);
    }
    if (jawabKecil) {
      tambah('mavix', jawabKecil);
      return;
    }
  } catch(e){ console.log('Otak Kecil error, lanjut ke server:', e); }

  // 2. OTAK TENGAH / SERVER - Kalau Otak Kecil tolak
  try {
    const res = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: teks }) });
    const data = await res.json();
    const jawab = data.reply || 'Bos, saya tidak dapat jawab tadi!';
    tambah('mavix', jawab);
  } catch(e){
    tambah('mavix', 'Bos, server saya lagi tidur: ' + e.message);
  }
}

document.getElementById('kirimBtn').addEventListener('click', kirim);
document.getElementById('input').addEventListener('keypress', function(e){ if(e.key === 'Enter') kirim(); });
window.kirim = kirim;
</script>
</body>
</html>
