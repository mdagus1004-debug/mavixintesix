<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIXINTESIX - HIDUP</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
body { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.pentas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; display:flex; align-items:center; justify-content:center; background-size:cover; background-position:center; overflow:hidden; }
body.malam { background:#050818; color:white; }
body.malam .pentas { background-image:url('background.jpg'); }
body.malam .header { background:rgba(5,8,24,0.7); }
body.malam .judul h1 { color:#22d3ee; }
body.malam .avatar { border-color:#22d3ee; }
body.malam .bar-mode { background:rgba(5,8,24,0.8); }
body.malam .bar-mode button { background:#1a1a1a; color:white; }
body.malam .bar-mode button.aktif { background:#22d3ee; color:#000; }
body.malam .mavix { background:rgba(30,42,74,0.9); border:1px solid #2e4a7a; color:white; }
body.malam .user { background:#22d3ee; color:#000; }
body.malam .input-row { background:rgba(5,8,24,0.8); }
body.malam #input { background:#1a1a1a; color:white; border:none; }
body.malam .btn { background:#22d3ee; }
body.malam .btn svg { fill:#000; }
body.siang { background:#F2F6FF; color:#111827; }
body.siang .pentas { background-image:url('background-siang.jpg'); }
body.siang .header { background:rgba(255,255,255,0.85); }
body.siang .judul h1 { color:#0EA5E9; }
body.siang .avatar { border-color:#0EA5E9; }
body.siang .bar-mode { background:rgba(255,255,255,0.9); }
body.siang .bar-mode button { background:#E5E7EB; color:#111827; }
body.siang .bar-mode button.aktif { background:#0EA5E9; color:#fff; }
body.siang .mavix { background:rgba(255,255,255,0.95); border:1px solid #D1D5DB; color:#111827; }
body.siang .user { background:#0EA5E9; color:#fff; }
body.siang .input-row { background:rgba(255,255,255,0.9); }
body.siang #input { background:#FFFFFF; color:#111827; border:1px solid #D1D5DB; }
body.siang .btn { background:#0EA5E9; }
body.siang .btn svg { fill:#fff; }
.header { display:flex; align-items:center; gap:12px; padding:12px 15px; }
.avatar { width:58px; height:58px; border-radius:50%; flex-shrink:0; border:3px solid; overflow:hidden; cursor:pointer; }
.avatar img { width:100%; height:100%; object-fit:cover; }
.judul { flex:1; }
.judul h1 { font-size:22px; }
#btnMode { border:none; background:transparent; font-size:24px; cursor:pointer; }
.bar-mode { display:flex; gap:8px; padding:7px 10px; justify-content:center; }
.bar-mode button { flex:none; padding:6px 14px; border:none; border-radius:15px; font-weight:bold; font-size:13px; cursor:pointer; }
#chatBox { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:82%; padding:12px 16px; border-radius:18px; font-size:16px; line-height:1.45; }
.mavix { align-self:flex-start; }
.user { align-self:flex-end; font-weight:500; }
.input-row { display:flex; gap:8px; padding:10px; align-items:center; }
#input { flex:1; padding:13px 16px; border-radius:25px; outline:none; font-size:15px; }
.btn { width:48px; height:48px; border:none; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.btn svg { width:26px; height:26px; margin-left:2px; }

/* ===== MAVIX HIDUP - PENUH 1 SKRIN, BADAN BERNAFAS + MULUT GERAK ===== */
#mavixBadan{
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  background-image:url('mavixintesix.jpg');
  background-size:cover; background-position:center;
  animation: bernafas 4s ease-in-out infinite;
}
@keyframes bernafas{
  0%,100%{ transform:scale(1.05); }
  50%{ transform:scale(1.08); }
}
#mavixBadan.ngomong{ animation-duration:2.2s; }
#mavixBadan.dengar{ animation-duration:3s; }
#mulutMavix{
  position:absolute; top:46%; left:50%;
  transform:translate(-50%,-50%);
  display:flex; gap:6px; align-items:center; justify-content:center;
  height:60px; z-index:5;
}
#mulutMavix span{
  width:7px; background:#22d3ee; border-radius:10px;
  height:8px; box-shadow:0 0 12px #22d3ee;
  transition:height 0.12s;
}
#mulutMavix.diam span{ height:6px; background:#1e3a5a; box-shadow:none; }
</style>
</head>
<body class="siang">

<!-- ========== LAYAR 1 - CHAT ========== -->
<div class="pentas"></div>
<div class="header">
  <div class="avatar" id="avatarBtn"><img src="mavix.jpg?v=2"></div>
  <div class="judul"><h1>MAVIXINTESIX</h1></div>
  <button id="btnMode" onclick="gantiBackgroundManual()">☀️</button>
</div>
<div class="bar-mode">
  <button id="btnNgobrol" class="aktif" onclick="gantiMode('NGOBROL')">💬 Ngobrol</button>
  <button id="btnBaca" onclick="gantiMode('BACA')">📖 Baca</button>
  <button id="btnSuara" onclick="gantiLayar('suara')" style="background:#ff9800 !important; color:white !important;">🎤 Ngobrol Suara</button>
</div>
<div id="chatBox"></div>
<div class="input-row">
  <input id="input" placeholder="Tulis untuk MAVIX...">
  <button class="btn" id="kirimBtn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
</div>

<!-- ========== LAYAR 2 - SUARA ========== -->
<div id="layar-suara" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:999; background:#050818; overflow:hidden;">
  <div style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.25); z-index:2;"></div>
  <button onclick="gantiLayar('chat')" style="position:absolute; top:15px; right:15px; width:40px; height:40px; border-radius:50%; border:none; background:white; color:black; font-size:20px; font-weight:bold; cursor:pointer; z-index:10;">✕</button>

  <!-- BADAN - Gambar kamu penuh 1 skrin, mavixintesix.jpg -->
  <div id="mavixBadan">
    <!-- MULUT - Di tengah dada, atas gelombang biru -->
    <div id="mulutMavix" class="diam">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
  </div>

  <div style="position:absolute; bottom:40px; left:0; width:100%; text-align:center; z-index:10;">
    <button id="btnMic" onclick="tekanMic()" style="width:80px; height:80px; border-radius:50%; border:3px solid white; background:#1e90ff; color:white; font-size:35px; cursor:pointer;">🎤</button>
    <div id="status" style="color:white; margin-top:10px; text-shadow:0 1px 5px black;">Tekan mic, lalu bicara</div>
    <div id="statusSuara" style="display:none;"></div>
  </div>
</div>

<script>
function tambah(siapa, teks){
  const chat = document.getElementById('chatBox');
  if(!chat) return;
  let kelas = 'mavix';
  if(siapa && siapa.toLowerCase() === 'user') kelas = 'user';
  const div = document.createElement('div');
  div.className = 'msg ' + kelas;
  if (teks.includes('<button') || teks.includes('<div id="isi_')) { div.innerHTML = teks.replace(/\n/g, '<br>'); }
  else { div.innerText = teks; }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
window.tambah = tambah;
</script>

<script src="otak-ingatan.js"></script>
<script src="otak-kecil.js"></script>
<script src="otak-tengah.js"></script>
<script src="mulut.js"></script>
<script src="telinga.js"></script>
<script src="otak-depan.js"></script>
<script>
window.modeMavix = localStorage.getItem('modeMavix') || "NGOBROL";
function gantiMode(modeBaru){
  window.modeMavix = modeBaru;
  localStorage.setItem('modeMavix', modeBaru);
  document.getElementById('btnNgobrol').classList.toggle('aktif', modeBaru === 'NGOBROL');
  document.getElementById('btnBaca').classList.toggle('aktif', modeBaru === 'BACA');
}
function terapkanMode(mode){
  document.body.classList.remove('siang','malam');
  document.body.classList.add(mode);
  document.getElementById('btnMode').innerText = mode === 'siang' ? '☀️' : '🌙';
}
function modeAutoIkutJam(){ const jam = new Date().getHours(); return (jam >= 6 && jam < 18) ? 'siang' : 'malam'; }
function gantiBackgroundManual(){
  const sekarang = document.body.classList.contains('siang') ? 'malam' : 'siang';
  terapkanMode(sekarang);
  localStorage.setItem('modeBackground', sekarang);
  localStorage.setItem('modeBackgroundManualHari', new Date().toDateString());
}
const manualHari = localStorage.getItem('modeBackgroundManualHari');
if(manualHari === new Date().toDateString()){ terapkanMode(localStorage.getItem('modeBackground') || 'siang'); }
else { terapkanMode(modeAutoIkutJam()); localStorage.removeItem('modeBackground'); }
setInterval(function(){ if(localStorage.getItem('modeBackgroundManualHari') !== new Date().toDateString()) terapkanMode(modeAutoIkutJam()); }, 60000);
window.gantiMode = gantiMode;
document.getElementById('input').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('kirimBtn').click(); } });

function gantiLayar(nama){
  let pentas = document.querySelector('.pentas');
  let header = document.querySelector('.header');
  let barMode = document.querySelector('.bar-mode');
  let chatBox = document.getElementById('chatBox');
  let inputRow = document.querySelector('.input-row');
  let suara = document.getElementById('layar-suara');
  if(nama === 'chat'){
    if(pentas) pentas.style.display = 'flex';
    if(header) header.style.display = 'flex';
    if(barMode) barMode.style.display = 'flex';
    if(chatBox) chatBox.style.display = 'flex';
    if(inputRow) inputRow.style.display = 'flex';
    if(suara) suara.style.display = 'none';
    if(typeof stopMulut === "function") stopMulut();
  }
  if(nama === 'suara'){
    if(pentas) pentas.style.display = 'none';
    if(header) header.style.display = 'none';
    if(barMode) barMode.style.display = 'none';
    if(chatBox) chatBox.style.display = 'none';
    if(inputRow) inputRow.style.display = 'none';
    if(suara) suara.style.display = 'block';
    window.modeMavix = "NGOBROL";
    localStorage.setItem('modeMavix', "NGOBROL");
    document.getElementById('btnNgobrol').classList.add('aktif');
    document.getElementById('btnBaca').classList.remove('aktif');
  }
}
window.gantiLayar = gantiLayar;
gantiMode(window.modeMavix);

// ===== MULUT GERAK + BADAN BERNAFAS, IKUT MIC =====
(function(){
  let mulut = null;
  let badan = null;
  function cari(){
    mulut = document.getElementById('mulutMavix');
    badan = document.getElementById('mavixBadan');
    if(!mulut || !badan) return;
    gerak();
  }
  function gerak(){
    if(!mulut || !badan) return;
    let sedangNgomong = window.MAVIX && window.MAVIX.sedangNgomong;
    let micNyala = window.MAVIX && window.MAVIX.micNyala;
    let bosNgomong = micNyala && window.MAVIX && window.MAVIX.antrianTerakhir;

    badan.classList.remove('ngomong','dengar');
    if(sedangNgomong) badan.classList.add('ngomong');
    else if(bosNgomong) badan.classList.add('dengar');

    let bars = mulut.querySelectorAll('span');
    if(sedangNgomong){
      mulut.classList.remove('diam');
      bars.forEach(function(b, i){
        let tengah = 1 - Math.abs(i - 6) / 7;
        let rawak = Math.random() * 45 + 10;
        b.style.height = (rawak * tengah + 8) + 'px';
        b.style.background = '#22d3ee';
      });
    } else if(bosNgomong){
      mulut.classList.remove('diam');
      bars.forEach(function(b, i){
        let tengah = 1 - Math.abs(i - 6) / 7;
        b.style.height = (Math.random() * 18 * tengah + 6) + 'px';
        b.style.background = '#ff9800';
      });
    } else {
      mulut.classList.add('diam');
      bars.forEach(function(b){ b.style.height = '6px'; });
    }
    setTimeout(gerak, 100);
  }
  setInterval(function(){ if(!mulut) cari(); }, 500);
  cari();
})();
</script>
</body>
</html>
