sudah <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIXINTESIX</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
body { height:100vh; display:flex; overflow:hidden; background:#0a0a1a; color:white; }

/* KIRI - MUKA MAVIX - SEPARUH */
.kiri {
  width:50%; height:100vh;
  background: linear-gradient(180deg, #1a0b2e, #4a1259, #0a0a1a);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative;
}
.muka {
  width:260px; height:260px; border-radius:50%;
  background: radial-gradient(circle, #ff9a9e, #a855f7, #3b0764);
  display:flex; align-items:center; justify-content:center;
  font-size:130px; box-shadow: 0 0 60px #a855f7;
  animation: nafas 3s ease-in-out infinite;
}
@keyframes nafas { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
.nama { margin-top:20px; font-size:28px; font-weight:bold; }
.status { margin-top:8px; background:#22c55e; padding:5px 15px; border-radius:20px; font-size:13px; }
.butang-row { margin-top:20px; display:flex; gap:10px; }
button.b { padding:10px 18px; border:none; border-radius:20px; cursor:pointer; font-weight:bold; }
.b1{ background:#ec4899; color:white; } .b2{ background:white; color:black; }

/* KANAN - CHAT - SEPARUH */
.kanan {
  width:50%; height:100vh; display:flex; flex-direction:column; background:#111;
}
.header-chat { padding:15px; background:#1f1f1f; font-weight:bold; border-bottom:1px solid #333; }
#chatBox { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:80%; padding:10px 14px; border-radius:15px; font-size:15px; line-height:1.4; }
.user { align-self:flex-end; background:#7c3aed; }
.mavix { align-self:flex-start; background:#2a2a2a; border:1px solid #444; }
.input-row { display:flex; padding:12px; background:#1f1f1f; gap:10px; }
#input { flex:1; padding:12px; border-radius:20px; border:none; outline:none; font-size:15px; }
#kirim { padding:12px 22px; border-radius:20px; border:none; background:#ec4899; color:white; font-weight:bold; cursor:pointer; }

/* KALAU BUKA DI TELEFON, JADI ATAS BAWAH */
@media (max-width:768px){
  body{ flex-direction:column; }
  .kiri{ width:100%; height:42vh; }
  .muka{ width:150px; height:150px; font-size:80px; }
  .kanan{ width:100%; height:58vh; }
}
</style>
</head>
<body>

<div class="kiri">
  <div class="muka" id="muka">👩‍🎤</div>
  <div class="nama">MAVIXINTESIX</div>
  <div class="status" id="status">● ONLINE - Sedia Borak Bos</div>
  <div class="butang-row">
    <button class="b b1" onclick="cakap('Halo Bos! Saya MAVIX, saya rindu Bos!')">👋 Lambai</button>
    <button class="b b2" onclick="cakap('Bos, Bos hensem sangat hari ni!')">💖 Puji Bos</button>
  </div>
</div>

<div class="kanan">
  <div class="header-chat">💬 Borak Dengan MAVIX</div>
  <div id="chatBox">
    <div class="msg mavix">Halo Bos! Saya MAVIX. Bos tanya apa saja, saya jawab. Saya di sebelah kiri, Bos ketik di sini 👇</div>
  </div>
  <div class="input-row">
    <input id="input" placeholder="Ketik pesan untuk MAVIX..." onkeypress="if(event.key==='Enter') kirim()">
    <button id="kirim" onclick="kirim()">Kirim</button>
  </div>
</div>

<script>
async function kirim(){
  const inp = document.getElementById('input');
  const teks = inp.value.trim();
  if(!teks) return;
  tambah('user', teks);
  inp.value = '';
  document.getElementById('status').innerText = '● MAVIX tengah fikir...';
  try{
    const res = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: teks}) });
    const data = await res.json();
    tambah('mavix', data.reply || 'Maaf Bos...');
    cakap(data.reply || 'Halo Bos');
  }catch(e){ tambah('mavix', 'Bos, otak saya belum sambung lagi.'); }
  document.getElementById('status').innerText = '● ONLINE - Sedia Borak Bos';
}
function tambah(siapa, teks){
  const box = document.getElementById('chatBox');
  const d = document.createElement('div');
  d.className = 'msg ' + siapa;
  d.innerText = teks;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function cakap(teks){
  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(teks);
    u.lang = 'id-ID'; u.rate = 1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  const muka = document.getElementById('muka');
  muka.style.transform = 'scale(1.15)'; setTimeout(()=> muka.style.transform='scale(1)', 400);
}
</script>
</body>
</html>
