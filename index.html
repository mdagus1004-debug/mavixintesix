<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIX - Teman Ngobrol</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f172a; color: white; font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
header { padding: 15px; text-align: center; font-size: 20px; font-weight: bold; background: #1e293b; }
#chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 12px 15px; border-radius: 15px; max-width: 80%; line-height: 1.5; }
.msg.user { background: #2563eb; align-self: flex-end; }
.msg.mavix { background: #334155; align-self: flex-start; }
#lemari { background: #1e293b; padding: 10px 15px; max-height: 150px; overflow-y: auto; font-size: 14px; }
#lemari h3 { font-size: 14px; margin-bottom: 8px; }
.laci { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #334155; }
.laci span { color: #94a3b8; }
#inputArea { display: flex; gap: 10px; padding: 15px; background: #1e293b; }
#input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; font-size: 16px; }
#kirimBtn { padding: 12px 20px; border-radius: 25px; border: none; background: #2563eb; color: white; font-weight: bold; }
#suaraBtn { padding: 12px 15px; border-radius: 25px; border: none; background: #475569; color: white; }
.modeBtn { padding: 5px 10px; border-radius: 15px; border: none; background: #475569; color: white; font-size: 12px; margin-right: 5px; }
.modeBtn.aktif { background: #2563eb; }
</style>
</head>
<body>
<header>MAVIX</header>
<div id="chatBox"></div>
<div id="lemari">
<h3>LEMARI MAVIX</h3>
<div id="isiLemari"></div>
<div style="margin-top:8px;">
<button class="modeBtn" data-mode="NGOBROL">NGOBROL</button>
<button class="modeBtn" data-mode="FOKUS">FOKUS</button>
<button class="modeBtn" data-mode="SANTAI">SANTAI</button>
<button class="modeBtn" data-mode="BACA">BACA</button>
</div>
</div>
<div id="inputArea">
<input id="input" placeholder="Ketik di sini Bos...">
<button id="suaraBtn" onclick="window.location.href='suara.html'">🎤</button>
<button id="kirimBtn">Kirim</button>
</div>
<script src="otak-ingatan.js"></script>
<script src="otak-nalar.js"></script>
<script src="otak-kecil.js"></script>
<script src="otak-tengah.js"></script>
<script src="mulut.js"></script>
<script src="telinga.js"></script>
<script src="otak-depan.js"></script>
<script>
window.modeMavix = "NGOBROL";
const daftarNamaLaci = ["nama","suka","hobi","kota","pekerjaan","perasaan","mode"];
const labelLaci = { nama:"Nama", suka:"Suka", hobi:"Hobi", kota:"Kota", pekerjaan:"Pekerjaan", perasaan:"Perasaan", mode:"Mode" };
async function tampilLemari(){
  const box = document.getElementById("isiLemari");
  if(!box) return;
  let html = "";
  for(let laci of daftarNamaLaci){
    let isi = [];
    try{ isi = await ambilCatatan(laci); }catch(e){}
    if(laci === "mode" && window.modeMavix) isi = [window.modeMavix];
    html += `<div class="laci"><b>${labelLaci[laci] || laci}</b><span>${isi.length ? isi.join(", ") : "-"}</span></div>`;
  }
  box.innerHTML = html;
}
function tambah(siapa, teks){
  const box = document.getElementById("chatBox");
  const div = document.createElement("div");
  div.className = siapa === "user" ? "msg user" : "msg mavix";
  div.textContent = teks;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
window.tambah = tambah;
document.addEventListener("DOMContentLoaded", () => {
  tampilLemari();
  document.querySelectorAll(".modeBtn").forEach(b => {
    b.addEventListener("click", async () => {
      window.modeMavix = b.dataset.mode;
      await simpanLaci("mode", [window.modeMavix]);
      document.querySelectorAll(".modeBtn").forEach(x => x.classList.remove("aktif"));
      b.classList.add("aktif");
      tampilLemari();
    });
  });
  setInterval(tampilLemari, 3000);
});

  window.gantiMode = async function(mode) {
  window.modeMavix = mode;
  try { await simpanLaci("mode", [mode]); } catch(e) {}
  document.querySelectorAll(".modeBtn").forEach(x => {
    x.classList.toggle("aktif", x.dataset.mode === mode || x.getAttribute("onclick")?.includes(mode));
  });
  tampilLemari();
};
</script>
</body>
</html>
