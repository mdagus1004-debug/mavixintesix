<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIXINTESIX</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
body { height:100vh; display:flex; flex-direction:column; background:#050818; color:white; overflow:hidden; }

/* ATAS - MACAM GAMBAR BOS */
.header {
  display:flex; align-items:center; gap:12px;
  padding:12px 15px; background:#0a0f2a; border-bottom:1px solid #1e293b;
}
.avatar {
  width:58px; height:58px; border-radius:50%; flex-shrink:0;
  border:3px solid #22d3ee; overflow:hidden; cursor:pointer;
  box-shadow:0 0 15px #22d3ee;
}
.avatar img { width:100%; height:100%; object-fit:cover; }
.judul { line-height:1.2; }
.judul h1 { font-size:22px; color:#22d3ee; letter-spacing:0.5px; }
.judul p { font-size:13px; color:#4ade80; }

/* TENGAH - CHAT */
#chatBox { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:82%; padding:12px 16px; border-radius:18px; font-size:16px; line-height:1.45; }
.mavix { align-self:flex-start; background:#1e2a4a; border:1px solid #2e4a7a; }
.user { align-self:flex-end; background:#22d3ee; color:#000; font-weight:500; }

/* BAWAH - TEMPAT KETIK - MACAM GAMBAR BOS */
.input-row { display:flex; gap:8px; padding:10px; background:#050818; align-items:center; }
#input {
  flex:1; padding:13px 16px; border-radius:25px; border:none; outline:none;
  background:#1a1a1a; color:white; font-size:15px;
}
#input::placeholder { color:#888; }
.btn { padding:12px 18px; border:none; border-radius:25px; font-weight:bold; font-size:15px; cursor:pointer; }
.kirim { background:#22d3ee; color:#000; }
.lambai { background:#22d3ee; color:#000; }
</style>
</head>
<body>

<!-- ATAS -->
<div class="header">
  <div class="avatar" onclick="lambai()">
    <!-- GANTI LINK GAMBAR MAVIX BOS DI SINI -->
    <img src="mavix.png" alt="MAVIX">
  </div>
  <div class="judul">
    <h1>MAVIXINTESIX</h1>
    <p>● Online - Tekan gambar saya untuk lambai</p>
  </div>
</div>

<!-- TENGAH -->
<div id="chatBox">
  <div class="msg mavix">Tanya saya apa-apa, mulut saya akan bergerak masa saya jawab.</div>
</div>

<!-- BAWAH -->
<div class="input-row">
  <input id="input" placeholder="Tulis untuk MAVIX..." onkeypress="if(event.key==='Enter') kirim()">
  <button class="btn kirim" onclick="kirim()">Kirim</button>
  <button class="btn lambai" onclick="lambai()">👋 Lambai</button>
</div>

<script>
async function kirim(){
  const inp = document.getElementById('input');
  const teks = inp.value.trim();
  if(!teks) return;
  tambah('user', teks);
  inp.value = '';
  try{
    const res = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: teks}) });
    const data = await res.json();
    const jawab = data.reply || 'Maaf Bos...';
    tambah('mavix', jawab);
    cakap(jawab);
  }catch(e){ tambah('mavix', 'Bos, otak saya belum sambung lagi.'); }
}
function tambah(siapa, teks){
  const box = document.getElementById('chatBox');
  const d = document.createElement('div');
  d.className = 'msg ' + siapa;
  d.innerText = teks;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function lambai(){
  cakap('Halo Bos! Saya MAVIX, saya lambai untuk Bos!');
}
function cakap(teks){
  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(teks);
    u.lang = 'id-ID';
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
}
</script>
</body>
</html>
