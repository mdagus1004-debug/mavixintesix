<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIX</title>

<!-- Gambar Bos cuma 200KB, jadi ringan, tapi tetap kita preload supaya langsung muncul -->
<link rel="preload" as="image" href="mavixintesix.jpg">

<style>
  body{ font-family: Arial, sans-serif; margin:0; padding:0; background:#111; color:white; }
  #layar-chat{ padding:15px; padding-bottom:90px; }
  #chatBox{ display:flex; flex-direction:column; gap:10px; }
  .user{ align-self:flex-end; background:#1e90ff; padding:10px; border-radius:15px; max-width:80%; }
  .mavix{ align-self:flex-start; background:#333; padding:10px; border-radius:15px; max-width:80%; }
  #inputBar{ position:fixed; bottom:0; left:0; width:100%; display:flex; background:#222; padding:10px; box-sizing:border-box; z-index:10; }
  #input{ flex:1; padding:10px; border-radius:20px; border:none; }
  #kirimBtn{ margin-left:10px; padding:10px 20px; border-radius:20px; border:none; background:#1e90ff; color:white; font-weight:bold; }
  #gelombang .batang{ transition: height 0.3s; }
  #gelombang.hidup .batang{ animation: naikTurun 0.6s infinite alternate; }
  #gelombang.hidup .batang:nth-child(2){ animation-delay:0.1s; }
  #gelombang.hidup .batang:nth-child(3){ animation-delay:0.2s; }
  #gelombang.hidup .batang:nth-child(4){ animation-delay:0.1s; }
  @keyframes naikTurun{ from{ height:15px; } to{ height:60px; } }
</style>
</head>
<body>

<!-- ========== LAYAR 1 - CHAT BIASA ========== -->
<div id="layar-chat">
  <div style="text-align:center; font-weight:bold; font-size:20px; padding-top:10px;">MAVIX</div>

  <div style="text-align:center; margin:10px 0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
    <button onclick="setModeChat('NGOBROL')" style="padding:8px 15px; border-radius:20px; border:none; background:#1e90ff; color:white; font-weight:bold;">NGOBROL</button>
    <button onclick="setModeChat('BACA')" style="padding:8px 15px; border-radius:20px; border:none; background:white; color:black; font-weight:bold;">BACA</button>
    <button onclick="gantiLayar('suara')" style="padding:8px 15px; border-radius:20px; border:none; background:#ff9800; color:white; font-weight:bold;">NGOBROL SUARA</button>
  </div>

  <div id="chatBox"></div>
</div>

<div id="inputBar">
  <input id="input" placeholder="Ketik di sini Bos...">
  <button id="kirimBtn">KIRIM</button>
</div>

<!-- ========== LAYAR 2 - SUARA FULL SCREEN ========== -->
<div id="layar-suara" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:999; background-image:url('mavixintesix.jpg'); background-size:cover; background-position:center; background-repeat:no-repeat;">
  <div style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.25);"></div>

  <div style="position:absolute; top:30px; left:0; width:100%; text-align:center; color:white; font-size:18px; font-weight:bold; text-shadow:0 2px 10px black;">
    MAVIX - MODE SUARA
  </div>

  <div id="gelombang" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; gap:6px; align-items:center; height:60px;">
    <div class="batang" style="width:6px; height:20px; background:white; border-radius:10px;"></div>
    <div class="batang" style="width:6px; height:40px; background:white; border-radius:10px;"></div>
    <div class="batang" style="width:6px; height:60px; background:white; border-radius:10px;"></div>
    <div class="batang" style="width:6px; height:40px; background:white; border-radius:10px;"></div>
    <div class="batang" style="width:6px; height:20px; background:white; border-radius:10px;"></div>
  </div>

  <div style="position:absolute; bottom:40px; left:0; width:100%; text-align:center;">
    <button id="btnMic" onclick="mulaDengar()" style="width:80px; height:80px; border-radius:50%; border:3px solid white; background:#1e90ff; color:white; font-size:35px; cursor:pointer;">🎤</button>
    <div id="statusSuara" style="color:white; margin-top:10px; text-shadow:0 1px 5px black;">Tekan mic, lalu bicara</div>
    <button onclick="gantiLayar('chat')" style="margin-top:20px; padding:10px 20px; border-radius:20px; border:none; background:white; color:black; font-weight:bold; cursor:pointer;">KELUAR - BALIK KE CHAT</button>
  </div>
</div>

<script>
function tambah(siapa, teks){
  let box = document.getElementById('chatBox');
  if(!box) return;
  let div = document.createElement('div');
  div.className = siapa;
  div.innerText = teks;
  box.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}
window.tambah = tambah;

function setModeChat(mode){
  window.modeMavix = mode;
  alert('Mode: ' + mode);
}

function gantiLayar(nama){
  let chat = document.getElementById('layar-chat');
  let inputBar = document.getElementById('inputBar');
  let suara = document.getElementById('layar-suara');
  if(chat) chat.style.display = 'none';
  if(inputBar) inputBar.style.display = 'none';
  if(suara) suara.style.display = 'none';

  if(nama === 'chat'){
    if(chat) chat.style.display = 'block';
    if(inputBar) inputBar.style.display = 'flex';
    if(typeof stopMulut === "function") stopMulut();
    window.modeMavix = "NGOBROL";
    let g = document.getElementById('gelombang');
    if(g) g.classList.remove('hidup');
  }
  if(nama === 'suara'){
    if(suara) suara.style.display = 'block';
    window.modeMavix = "NGOBROL";
  }
}

let sedangDengar = null;
let micKunci = false;
function mulaDengar(){
  if(micKunci) return;
  let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    alert('HP Bos tidak support dengar suara, pakai Chrome ya Bos');
    return;
  }
  if(sedangDengar){ try{ sedangDengar.stop(); }catch(e){} }

  let dengar = new SR();
  dengar.lang = 'id-ID';
  dengar.interimResults = false;
  dengar.continuous = false;

  micKunci = true;
  document.getElementById('statusSuara').innerText = 'Mendengar... bicara Bos...';
  document.getElementById('btnMic').style.background = 'red';

  dengar.onresult = function(e){
    let teksBos = e.results[0][0].transcript;
    document.getElementById('statusSuara').innerText = 'Bos bilang: ' + teksBos;
    if(typeof kirimPesanSuara === "function"){
      kirimPesanSuara(teksBos);
    }
  };
  dengar.onend = function(){
    micKunci = false;
    document.getElementById('btnMic').style.background = '#1e90ff';
  };
  dengar.onerror = function(){
    micKunci = false;
    document.getElementById('statusSuara').innerText = 'Tekan mic, lalu bicara';
    document.getElementById('btnMic').style.background = '#1e90ff';
  };

  sedangDengar = dengar;
  dengar.start();
}

function gelombangHidup(hidup){
  let g = document.getElementById('gelombang');
  if(!g) return;
  if(hidup) g.classList.add('hidup');
  else g.classList.remove('hidup');
}
window.gelombangHidup = gelombangHidup;
</script>

<script src="otak-ingatan.js"></script>
<script src="otak-kecil.js"></script>
<script src="otak-tengah.js"></script>
<script src="mulut.js"></script>
<script src="otak-depan.js"></script>
</body>
</html>
