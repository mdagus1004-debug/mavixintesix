<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIXINTESIX - HIDUP</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
body { height:100vh; display:flex; flex-direction:column; color:white; overflow:hidden; background:#050818; }
.pentas { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; display:flex; flex-direction:column; align-items:center; justify-content:center; background-image: url('background.jpg'); background-size: cover; background-position: center center; background-repeat: no-repeat; overflow:hidden; }
.cahaya { position:absolute; width:350px; height:350px; border-radius:50%; background: radial-gradient(circle, rgba(34,211,238,0.5), transparent 70%); animation: denyut 2.5s ease-in-out infinite; }
@keyframes denyut { 0%,100%{transform:scale(1); opacity:0.6} 50%{transform:scale(1.2); opacity:1} }
.mavix-body { position:relative; width:340px; height:520px; animation: terapung 3s ease-in-out infinite; }
@keyframes terapung { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.lapis { position:absolute; inset:0; background-image:url('mavix.jpg?v=2'); background-size:340px 520px; background-position:center; background-repeat:no-repeat; }
.lapis-kepala { clip-path: polygon(0% 0%, 100% 0%, 100% 38%, 0% 38%); transform-origin:50% 35%; animation: goyangKepala 4s ease-in-out infinite; z-index:3; }
@keyframes goyangKepala { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-2deg)} 75%{transform:rotate(2deg)} }
.lapis-mata { clip-path: polygon(32% 28%, 68% 28%, 68% 36%, 32% 36%); animation: kedipMata 3.5s infinite; z-index:4; }
@keyframes kedipMata { 0%,92%,100%{transform:scaleY(1); filter:brightness(1)} 94%{transform:scaleY(0.05); filter:brightness(0)} 96%{transform:scaleY(1)} }
.lapis-mulut { clip-path: polygon(40% 38%, 60% 38%, 60% 46%, 40% 46%); z-index:4; }
.lapis-mulut.cakap { animation: mulutCakap 0.25s infinite; }
@keyframes mulutCakap { 0%{transform:scaleY(1)} 50%{transform:scaleY(1.5)} 100%{transform:scaleY(0.8)} }
.lapis-tangan-kiri { clip-path: polygon(0% 45%, 28% 45%, 28% 75%, 0% 75%); transform-origin:25% 50%; animation: goyangTanganKiri 3s ease-in-out infinite; z-index:2; }
@keyframes goyangTanganKiri { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(8deg)} }
.lapis-tangan-kanan { clip-path: polygon(72% 45%, 100% 45%, 100% 75%, 72% 75%); transform-origin:75% 50%; z-index:2; }
.lapis-tangan-kanan.lambai { animation: lambaiTangan 0.5s infinite; }
@keyframes lambaiTangan { 0%{transform:rotate(0deg)} 50%{transform:rotate(-18deg) translateY(-8px)} 100%{transform:rotate(0deg)} }
.lapis-badan { clip-path: polygon(0% 38%, 100% 38%, 100% 100%, 0% 100%); z-index:1; }
.header { display:flex; align-items:center; gap:12px; padding:12px 15px; background:rgba(5,8,24,0.7); }
.avatar { width:58px; height:58px; border-radius:50%; flex-shrink:0; border:3px solid #22d3ee; overflow:hidden; cursor:pointer; }
.avatar img { width:100%; height:100%; object-fit:cover; }
.judul h1 { font-size:22px; color:#22d3ee; }
.judul p { font-size:13px; color:#4ade80; }
#chatBox { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:82%; padding:12px 16px; border-radius:18px; font-size:16px; line-height:1.45; }
.mavix { align-self:flex-start; background:rgba(30,42,74,0.9); border:1px solid #2e4a7a; }
.user { align-self:flex-end; background:#22d3ee; color:#000; font-weight:500; }
.input-row { display:flex; gap:8px; padding:10px; background:rgba(5,8,24,0.8); align-items:center; }
#input { flex:1; padding:13px 16px; border-radius:25px; border:none; outline:none; background:#1a1a1a; color:white; font-size:15px; }
.btn { padding:12px 18px; border:none; border-radius:25px; font-weight:bold; font-size:15px; cursor:pointer; background:#22d3ee; color:#000; }
</style>
</head>
<body>
<div class="pentas">
  <div class="cahaya"></div>
  <div class="mavix-body">
    <div class="lapis lapis-badan"></div>
    <div class="lapis lapis-tangan-kiri"></div>
    <div class="lapis lapis-tangan-kanan" id="tanganKanan"></div>
    <div class="lapis lapis-kepala"></div>
    <div class="lapis lapis-mata"></div>
    <div class="lapis lapis-mulut" id="mulutLapis"></div>
  </div>
</div>
<div class="header">
  <div class="avatar" id="avatarBtn"><img src="mavix.jpg?v=2"></div>
  <div class="judul"><h1>MAVIXINTESIX</h1><p>● Online - GPT 120B Hidup</p></div>
</div>
<div id="chatBox"><div class="msg mavix">Halo Bos! Saya MAVIX, sudah pakai otak GPT 120B! Kepala saya goyang, mata saya kedip, tangan saya goyang sendiri!</div></div>
<div class="input-row">
  <input id="input" placeholder="Tulis untuk MAVIX...">
  <button class="btn" id="kirimBtn">Kirim</button>
  <button class="btn" id="lambaiBtn">👋 Lambai</button>
</div>

<script src="otak-ingatan.js"></script>
<script src="otak-kecil.js"></script>
<script src="otak-tengah.js"></script>
<script src="mulut.js"></script>
<script>
  
// ===== JEMBATAN MULUT KE BADAN =====
function mavixNgomong(lagiNgomong){
  const m = document.getElementById('mulutLapis');
  if(!m) return;
  if(lagiNgomong){ m.classList.add('cakap'); } else { m.classList.remove('cakap'); }
}
window.mavixNgomong = mavixNgomong;

function tambah(siapa, teks){
  const chat = document.getElementById("chatBox");
  const div = document.createElement("div");
  div.className = 'msg ' + siapa;
  if (teks.includes("<button")) {
    div.innerHTML = teks;
  } else {
    div.innerText = teks;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
// Semua suara lewat bicara() dari mulut.js
function cakap(teks){
  if(typeof bicara === 'function'){ bicara(teks); }
  else { mavixNgomong(true); setTimeout(function(){ mavixNgomong(false); }, 2000); }
}

function lambai(){
  const t = document.getElementById('tanganKanan');
  t.classList.add('lambai'); cakap('Halo Bos! Saya lambai untuk Bos!');
  setTimeout(function(){ t.classList.remove('lambai'); }, 3000);
}

  // ===== GANTI MODE - FIX DARI OTAK.JS =====
let modeMavix = "NGOBROL";
function gantiMode(modeBaru){
  modeMavix = modeBaru;
  const judul = document.querySelector('.judul p');
  if(judul){
    if(modeBaru === "KERJA") judul.innerText = "● Online - Mode Kerja";
    else judul.innerText = "● Online - Mode Ngobrol";
  }
}
window.gantiMode = gantiMode;

async function kirim(){
  const inp = document.getElementById('input');
  const teks = inp.value.trim(); if(!teks) return;
  tambah('user', teks); inp.value='';
  try {
    if (typeof OtakKecil !== 'undefined' && OtakKecil.fikir) {
      OtakKecil.fikir(teks, function(jawab){ tambah('mavix', jawab); cakap(jawab); });
      return;
    }
    const res = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: teks }) });
    const data = await res.json();
    const jawab = data.reply || 'Bos, saya tidak dapat jawab tadi!';
    tambah('mavix', jawab); cakap(jawab);
  } catch(e){
    tambah('mavix', 'Bos, server saya lagi tidur: ' + e.message);
  }
}
document.getElementById('kirimBtn').addEventListener('click', kirim);
document.getElementById('lambaiBtn').addEventListener('click', lambai);
document.getElementById('avatarBtn').addEventListener('click', lambai);
document.getElementById('input').addEventListener('keypress', function(e){ if(e.key === 'Enter') kirim(); });
window.kirim = kirim; window.lambai = lambai; window.cakap = cakap;
</script>
</body>
</html>
