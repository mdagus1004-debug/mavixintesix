<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIXINTESIX</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
body { height:100vh; display:flex; flex-direction:column; color:white; overflow:hidden; }

/* GAMBAR FULL SCREEN + BERNAFAS */
.bg-full {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:-1; object-fit:cover;
  animation: nafas 3.5s ease-in-out infinite;
}
@keyframes nafas { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }

.lapisan-gelap { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.1), rgba(0,0,0,0.65)); z-index:-1; }

/* MATA BERKEDIP - BAYANG ATAS MATA */
.kedip {
  position:fixed; top:38%; left:50%; transform:translateX(-50%);
  width:220px; height:14px; background:#050818; z-index:0;
  border-radius:50%; opacity:0; pointer-events:none;
  animation: kedip 4s infinite;
}
@keyframes kedip { 0%,92%,100%{opacity:0} 94%{opacity:1} 96%{opacity:0} }

/* MULUT GERAK BILA BICARA */
.mulut {
  position:fixed; top:55%; left:50%; transform:translateX(-50%);
  width:70px; height:10px; background:#ff2d78; border-radius:20px;
  z-index:0; display:none;
}
.mulut.hidup { display:block; animation: mulutGerak 0.3s infinite; }
@keyframes mulutGerak { 0%{height:6px; width:50px} 50%{height:22px; width:75px} 100%{height:8px; width:55px} }

/* TANGAN LAMBAI */
.tangan {
  position:fixed; top:48%; right:12%; font-size:90px; z-index:1; display:none;
}
.tangan.hidup { display:block; animation: lambaiTangan 0.6s infinite; }
@keyframes lambaiTangan { 0%{transform:rotate(0deg)} 50%{transform:rotate(25deg)} 100%{transform:rotate(0deg)} }

.header { display:flex; align-items:center; gap:12px; padding:12px 15px; background:rgba(5,8,24,0.7); }
.avatar { width:58px; height:58px; border-radius:50%; flex-shrink:0; border:3px solid #22d3ee; overflow:hidden; cursor:pointer; box-shadow:0 0 15px #22d3ee; }
.avatar img { width:100%; height:100%; object-fit:cover; }
.judul h1 { font-size:22px; color:#22d3ee; }
.judul p { font-size:13px; color:#4ade80; }
#chatBox { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:82%; padding:12px 16px; border-radius:18px; font-size:16px; line-height:1.45; }
.mavix { align-self:flex-start; background:rgba(30,42,74,0.9); border:1px solid #2e4a7a; }
.user { align-self:flex-end; background:#22d3ee; color:#000; font-weight:500; }
.input-row { display:flex; gap:8px; padding:10px; background:rgba(5,8,24,0.8); align-items:center; }
#input { flex:1; padding:13px 16px; border-radius:25px; border:none; outline:none; background:#1a1a1a; color:white; font-size:15px; }
.btn { padding:12px 18px; border:none; border-radius:25px; font-weight:bold; font-size:15px; cursor:pointer; }
.kirim { background:#22d3ee; color:#000; }
.lambai { background:#22d3ee; color:#000; }
</style>
</head>
<body>

<img src="mavix.jpg" class="bg-full">
<div class="lapisan-gelap"></div>
<div class="kedip"></div>
<div class="mulut" id="mulut"></div>
<div class="tangan" id="tangan">👋</div>

<div class="header">
  <div class="avatar" onclick="lambai()"><img src="mavix.jpg" alt="MAVIX"></div>
  <div class="judul"><h1>MAVIXINTESIX</h1><p>● Online - Tekan gambar saya untuk lambai</p></div>
</div>

<div id="chatBox"><div class="msg mavix">Halo Bos! Saya sudah hidup! Saya boleh bernafas, berkedip, lambai dan mulut saya gerak bila saya bicara!</div></div>

<div class="input-row">
  <input id="input" placeholder="Tulis untuk MAVIX..." onkeypress="if(event.key==='Enter') kirim()">
  <button class="btn kirim" onclick="kirim()">Kirim</button>
  <button class="btn lambai" onclick="lambai()">👋 Lambai</button>
</div>

<script>
async function kirim(){
  const inp = document.getElementById('input');
  const teks = inp.value.trim();
  if(!teks) return;
  tambah('user', teks); inp.value = '';
  try{
    const res = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: teks}) });
    const data = await res.json();
    const jawab = data.reply || 'Maaf Bos...';
    tambah('mavix', jawab); cakap(jawab);
  }catch(e){ tambah('mavix', 'Bos, otak saya belum sambung lagi.'); }
}
function tambah(siapa, teks){
  const box = document.getElementById('chatBox');
  const d = document.createElement('div');
  d.className = 'msg ' + siapa; d.innerText = teks;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
function lambai(){
  const t = document.getElementById('tangan');
  t.classList.add('hidup');
  cakap('Halo Bos! Saya MAVIX, saya lambai untuk Bos!');
  setTimeout(()=> t.classList.remove('hidup'), 3000);
}
function cakap(teks){
  const m = document.getElementById('mulut');
  m.classList.add('hidup'); // MULUT GERAK
  if('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(teks);
    u.lang = 'id-ID';
    u.onend = ()=> m.classList.remove('hidup');
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(()=> m.classList.remove('hidup'), teks.length * 80);
  } else { setTimeout(()=> m.classList.remove('hidup'), 2000); }
}
</script>
</body>
</html>
