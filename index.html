<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAVIX - Teman Ngobrol Bos</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family: system-ui, -apple-system, sans-serif; color:#fff; height:100dvh; display:flex; flex-direction:column; background-size:cover; background-position:center; background-repeat:no-repeat; background-color:#0f172a; }
  body::before{ content:""; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:-1; }
  .kepala{ padding:14px 16px; background:rgba(30,41,59,0.85); display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1; }
  .kepala b{ font-size:20px; letter-spacing:2px; }
  .kepala span{ font-size:12px; color:#94a3b8; }
  .mode{ display:flex; gap:8px; padding:10px 12px; background:rgba(30,41,59,0.85); border-top:1px solid #334155; position:relative; z-index:1; }
  .mode button{ flex:1; padding:10px; border:1px solid #334155; background:#0f172a; color:#cbd5e1; border-radius:12px; font-size:14px; }
  .mode button.aktif{ background:#2563eb; color:#fff; border-color:#2563eb; }
  #chat{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; position:relative; z-index:1; }
  .pesan{ max-width:85%; padding:11px 14px; border-radius:16px; font-size:15px; line-height:1.5; word-wrap:break-word; }
  .pesan.user{ align-self:flex-end; background:#2563eb; color:#fff; border-bottom-right-radius:4px; }
  .pesan.mavix{ align-self:flex-start; background:rgba(30,41,59,0.9); color:#e2e8f0; border-bottom-left-radius:4px; }
  #status{ text-align:center; font-size:12px; color:#e2e8f0; padding:6px; min-height:22px; position:relative; z-index:1; text-shadow:0 1px 4px #000; }
  .bawah{ padding:10px 12px 14px; background:rgba(30,41,59,0.85); display:flex; gap:8px; align-items:center; position:relative; z-index:1; }
  #input{ flex:1; padding:13px 14px; border-radius:24px; border:1px solid #334155; background:#0f172a; color:#fff; font-size:15px; outline:none; }
  #micBtn{ width:48px; height:48px; border-radius:50%; border:none; background:#334155; color:#fff; font-size:20px; flex-shrink:0; }
  #micBtn.aktif{ background:#dc2626; }
  #kirimBtn{ width:48px; height:48px; border-radius:50%; border:none; background:#2563eb; color:#fff; font-size:18px; flex-shrink:0; }
  .pindah{ display:block; text-align:center; padding:8px; color:#60a5fa; font-size:13px; text-decoration:none; background:rgba(30,41,59,0.85); border-top:1px solid #334155; position:relative; z-index:1; }
</style>
</head>
<body>
<div class="kepala">
  <div><b>MAVIX</b><br><span>Teman Ngobrol Bos</span></div>
  <span id="jamKepala">--:--</span>
</div>

<div class="mode">
  <button id="modeNgobrol" class="aktif" onclick="gantiMode('NGOBROL')">NGOBROL</button>
  <button id="modeBaca" onclick="gantiMode('BACA')">BACA</button>
</div>

<div id="chat"></div>
<div id="status">Siap Bos.</div>

<div class="bawah">
  <button id="micBtn" title="Tekan untuk bicara">🎤</button>
  <input id="input" type="text" placeholder="Ketik di sini Bos..." autocomplete="off">
  <button id="kirimBtn" title="Kirim">➤</button>
</div>
<a class="pindah" href="suara.html">Pindah ke Mode Suara Penuh →</a>

<script src="otak-ingatan.js"></script>
<script src="otak-kecil.js"></script>
<script src="otak-tengah.js"></script>
<script src="mulut.js"></script>
<script src="telinga.js"></script>
<script src="otak-depan.js"></script>
<script>
  window.modeMavix = "NGOBROL";
  function gantiMode(mode){
    window.modeMavix = mode;
    document.getElementById('modeNgobrol').classList.toggle('aktif', mode === 'NGOBROL');
    document.getElementById('modeBaca').classList.toggle('aktif', mode === 'BACA');
  }
  function tambah(siapa, teks){
    const chat = document.getElementById('chat');
    const d = document.createElement('div');
    d.className = 'pesan ' + (siapa === 'user' ? 'user' : 'mavix');
    d.innerText = teks;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }
  window.tambah = tambah;
  // GANTI BACKGROUND SIANG / MALAM OTOMATIS
  function gantiBackground(){
    const jam = new Date().getHours();
    if(jam >= 6 && jam < 18){
      document.body.style.backgroundImage = "url('background-siang.jpg')";
    } else {
      document.body.style.backgroundImage = "url('background.jpg')";
    }
  }
  gantiBackground();
  // Jam di kepala, update tiap 30 detik
  function updateJam(){
    const el = document.getElementById('jamKepala');
    if(el) el.innerText = new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
  }
  updateJam();
  setInterval(updateJam, 30000);
  // Pesan awal
  window.addEventListener('load', () => {
    setTimeout(() => tambah('mavix', 'Halo Bos, saya MAVIX. Bos mau cerita apa hari ini?'), 300);
  });
</script>
</body>
</html>
