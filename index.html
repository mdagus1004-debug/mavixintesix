<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIXINTESIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0f1e;color:white;height:100vh;display:flex;flex-direction:column}
.header{background:#111a33;padding:12px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #00e5ff}
.mavix-box{position:relative;width:60px;height:60px;cursor:pointer}
.mavix-box img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #00e5ff;animation:nafas 3s ease-in-out infinite}
@keyframes nafas{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes kedip{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(0.1)}96%{transform:scaleY(1)}}
.mavix-box img.kedip{animation:nafas 3s ease-in-out infinite, kedip 4s infinite}
#tangan{position:absolute;right:-18px;top:-5px;font-size:30px;display:none}
#tangan.aktif{display:block;animation:lambai 0.5s ease-in-out 5}
@keyframes lambai{0%,100%{transform:rotate(0deg)}50%{transform:rotate(30deg)}}
#mulut{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:18px;height:6px;background:#ff5b7a;border-radius:10px;display:none}
#mulut.bicara{display:block;animation:bicara 0.3s infinite}
@keyframes bicara{0%,100%{height:4px;width:14px}50%{height:12px;width:20px}}
.header h1{font-size:18px;color:#00e5ff}
.header p{font-size:12px;color:#8affff}
#chat{flex:1;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:15px;font-size:15px;line-height:1.4}
.me{background:#00e5ff;color:#000;align-self:flex-end}
.mavix{background:#1e2a4a;align-self:flex-start;border:1px solid #00e5ff33}
.input-area{display:flex;padding:10px;background:#111a33;gap:8px;flex-wrap:wrap}
input{flex:1;padding:12px;border-radius:20px;border:none;outline:none;background:#0a0f1e;color:white;min-width:150px}
button{padding:12px 15px;border-radius:20px;border:none;background:#00e5ff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div class="mavix-box" onclick="lambai()">
<img id="mavixImg" src="mavix.jpg" class="kedip">
<span id="tangan">👋</span>
<div id="mulut"></div>
</div>
<div><h1>MAVIXINTESIX</h1><p>● Online - Tekan gambar saya untuk lambai</p></div>
</div>

<div id="chat">
<div class="msg mavix">Halo Bos! Saya MAVIX. Tekan gambar saya, saya akan lambai. Tanya saya apa-apa, mulut saya akan bergerak masa saya jawab.</div>
</div>

<div class="input-area">
<input id="teks" placeholder="Tulis untuk MAVIX...">
<button onclick="kirim()">Kirim</button>
<button onclick="lambai()">👋 Lambai</button>
<button onclick="cakapUlang()">🔊 Suara</button>
</div>

<script>
let jawabanTerakhir = "Halo Bos! Saya MAVIX.";

function lambai(){
  let tangan = document.getElementById('tangan');
  tangan.classList.remove('aktif');
  void tangan.offsetWidth;
  tangan.classList.add('aktif');
  setTimeout(()=> tangan.classList.remove('aktif'), 2600);
}

function bicara(teks){
  let mulut = document.getElementById('mulut');
  mulut.classList.add('bicara');
  // Suara perempuan Indonesia
  try{
    speechSynthesis.cancel();
    let u = new SpeechSynthesisUtterance(teks);
    u.lang = 'id-ID';
    u.rate = 1;
    u.pitch = 1.2;
    speechSynthesis.speak(u);
    u.onend = ()=> mulut.classList.remove('bicara');
    // Kalau suara tak jalan, mulut berhenti lepas 3 saat
    setTimeout(()=> mulut.classList.remove('bicara'), 4000);
  }catch(e){ setTimeout(()=> mulut.classList.remove('bicara'), 3000); }
}

function cakapUlang(){ bicara(jawabanTerakhir); }

async function kirim(){
  let input = document.getElementById('teks');
  let teks = input.value.trim();
  if(!teks) return;
  let chat = document.getElementById('chat');
  chat.innerHTML += `<div class="msg me">${teks}</div>`;
  input.value = '';
  chat.scrollTop = chat.scrollHeight;
  try{
    let res = await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:teks})});
    let data = await res.json();
    let jawab = data.reply || data.jawaban || data.response || data.pesan || "Maaf Bos, saya belum faham.";
    jawabanTerakhir = jawab;
    chat.innerHTML += `<div class="msg mavix">${jawab}</div>`;
    chat.scrollTop = chat.scrollHeight;
    bicara(jawab);
  }catch(e){
    chat.innerHTML += `<div class="msg mavix">Bos, otak saya belum sambung.</div>`;
  }
}
document.getElementById('teks').addEventListener('keypress',e=>{if(e.key==='Enter') kirim();});
</script>
</body>
</html>
