<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mavix</title>
<style>
  body {
    margin: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  /* Badan V Mavix - ini tombolnya */
  #gambarMavix {
    width: 90vw;
    max-width: 380px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
  }
  #gambarMavix:active {
    transform: scale(0.96);
  }
  /* Tombol mic & tulisan disembunyikan saja, fungsi tetap ada */
  #tombolMic, #status {
    display: none !important;
  }
</style>
</head>
<body>

  <!-- GAMBAR MAVIX - BADAN V - TEKAN SINI -->
  <img id="gambarMavix" src="mavixintesix.jpg" onclick="tekanMic()" alt="Mavix">

  <!-- Tetap ada tapi disembunyikan, jangan dibuang -->
  <button id="tombolMic"></button>
  <p id="status"></p>

<script src="telinga.js"></script>
<script src="otak-depan.js"></script>
</body>
</html>
