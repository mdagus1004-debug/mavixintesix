<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIXINTESIX - SUARA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
body { height:100vh; overflow:hidden; background:#000; }

#layar-suara{
  position:fixed; top:0; left:0; width:100%; height:100%;
  background-image:url('mavixintesix.jpg');
  background-size:cover; background-position:center;
  overflow:hidden;
  animation: bernafas 5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes bernafas{
  0%,100%{ transform:scale(1.03); }
  50%{ transform:scale(1.0); }
}

#wadah-tombol{
  position:fixed; bottom:40px; left:0; width:100%; text-align:center;
  z-index:9999;
  pointer-events:auto;
}
#tombolMic{
  width:80px; height:80px; border-radius:50%;
  border:3px solid white; background:#1e90ff; color:white;
  font-size:35px; cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
}
#btnKeluar{
  position:fixed; top:15px; right:15px; width:40px; height:40px;
  border-radius:50%; border:none; background:white; color:black;
  font-size:20px; font-weight:bold; cursor:pointer; z-index:9999;
}
</style>
</head>
<body>
<div id="layar-suara"></div>

<button id="btnKeluar" onclick="window.location.href='index.html'">✕</button>

<div id="wadah-tombol">
  <button id="tombolMic">🎤</button>
  <div id="status" style="color:white; margin-top:10px; text-shadow:0 1px 5px black;">Tekan mic, lalu bicara</div>
  <div id="statusSuara" style="display:none;"></div>
</div>

<script>
function tambah(siapa, teks){}
window.tambah = tambah;
</script>
<script src="otak-ingatan.js"></script>
<script src="otak-kecil.js"></script>
<script src="otak-tengah.js"></script>
<script src="mulut.js"></script>
<script src="telinga.js"></script>
<script src="otak-depan.js"></script>
<script>
window.modeMavix = "NGOBROL";
localStorage.setItem('modeMavix', "NGOBROL");
</script>
</body>
</html>
