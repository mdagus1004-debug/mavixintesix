<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVIXINTESIX - SUARA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
body { height:100vh; overflow:hidden; background:#000; }
#layar-suara{
  position:fixed; top:0; left:0; width:100%; height:100%;
  background-image:url('mavixintesix.jpg');
  background-size:cover; background-position:center;
  overflow:hidden;
  animation: bernafas 5s ease-in-out infinite;
  cursor:pointer;
  pointer-events:auto;
}
@keyframes bernafas{
  0%,100%{ transform:scale(1.03); }
  50%{ transform:scale(1.0); }
}

/* === MULUT GELOMBANG - POSISI HASIL ANALISIS GAMBAR === */
#mulut-gelombang{
  position:absolute;
  top:37.5%; /* 37.5% = NGAM ATAS MULUT ASAL, BAWAH HURUF V */
  left:50%;
  transform:translate(-50%, -50%);
  width:34vw;
  max-width:230px;
  height:52px;
  display:flex; align-items:center; justify-content:center; gap:3px;
  background:transparent;
  padding:0;
  pointer-events:none; /* BIAR TAK HALANG TEKANAN BADAN V */
}
#mulut-gelombang span{
  width:4px; height:8px;
  background:#00e5ff;
  border-radius:3px;
  box-shadow:0 0 10px #00e5ff, 0 0 20px #00e5ff;
  transition:height 0.1s;
}
/* KALAU MAVIX BICARA, BARU GOYANG */
#mulut-gelombang.ngomong span{
  animation:goyangMulut 0.35s ease-in-out infinite alternate;
}
#mulut-gelombang.ngomong span:nth-child(2){ animation-delay:0.05s; }
#mulut-gelombang.ngomong span:nth-child(3){ animation-delay:0.1s; }
#mulut-gelombang.ngomong span:nth-child(4){ animation-delay:0.15s; }
#mulut-gelombang.ngomong span:nth-child(5){ animation-delay:0.2s; }
#mulut-gelombang.ngomong span:nth-child(6){ animation-delay:0.1s; }
#mulut-gelombang.ngomong span:nth-child(7){ animation-delay:0.05s; }
#mulut-gelombang.ngomong span:nth-child(8){ animation-delay:0.15s; }
#mulut-gelombang.ngomong span:nth-child(9){ animation-delay:0.1s; }
#mulut-gelombang.ngomong span:nth-child(10){ animation-delay:0s; }
@keyframes goyangMulut{
  0%{ height:6px; }
  100%{ height:42px; }
}

/* DISEMBUNYIKAN SAJA - FUNGSI TETAP JALAN, BOS TEKAN BADAN V SAJA */
#wadah-tombol{
  display: none !important;
}
#tombolMic{
  width:80px; height:80px; border-radius:50%;
  border:3px solid white; background:#1e90ff; color:white;
  font-size:35px; cursor:pointer; pointer-events:auto; touch-action:manipulation;
}
#btnKeluar{
  position:fixed; top:15px; right:15px; width:40px; height:40px;
  border-radius:50%; border:none; background:white; color:black;
  font-size:20px; font-weight:bold; cursor:pointer; z-index:9999;
}
</style>
</head>
<body>
<div id="layar-suara">
  <!-- MULUT PALSU YANG BISA GOYANG -->
  <div id="mulut-gelombang">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>
<button id="btnKeluar" onclick="window.location.href='index.html'">✕</button>
<div id="wadah-tombol">
  <button id="tombolMic">🎤</button>
  <div id="status" style="color:white; margin-top:10px; text-shadow:0 1px 5px black;">Tekan mic, lalu bicara</div>
  <div id="statusSuara" style="display:none;"></div>
</div>
<script>
function tambah(siapa, teks){}
window.tambah = tambah;
</script>
<script src="otak-ingatan.js"></script>
<script src="otak-kecil.js"></script>
<script src="otak-tengah.js"></script>
<script src="mulut.js"></script>
<script src="telinga.js"></script>
<script src="otak-depan.js"></script>
<script>
window.modeMavix = "NGOBROL";
localStorage.setItem('modeMavix', "NGOBROL");
</script>
<script>
// PENGAWAL MULUT - KALAU sedangNgomong = TRUE, GOYANG. KALAU FALSE, DIAM
setInterval(() => {
  const mulut = document.getElementById('mulut-gelombang');
  if (!mulut) return;
  if (window.MAVIX && window.MAVIX.sedangNgomong) {
    mulut.classList.add('ngomong');
  } else {
    mulut.classList.remove('ngomong');
  }
}, 100);
</script>
</body>
</html>
